<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うさポン</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
/* ★1128a うさポン 本番（お試しの人だけ・USAPON_OPEN を on で公開）。🏆ランキングつき。係【新1128a】といっしょに入れてね */
*{box-sizing:border-box}
body{margin:0;background:#FCF8F5;color:#29221E;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;font-weight:500;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;word-break:auto-phrase}
.wrap{max-width:440px;margin:0 auto;padding:0 10px 30px}
header{background:linear-gradient(135deg,#9A5F37,#CA7B47);color:#fff;text-align:center;padding:10px;border-radius:0 0 20px 20px;margin:0 -10px 10px}
header h1{margin:0;font-size:20px;font-weight:800}
header .s{font-size:12px}
.lead{text-align:center;color:#613F29;margin:6px 0 10px}
.games{display:flex;flex-direction:column;gap:10px}
.gamecard{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid #E8D3C5;background:#fff;border-radius:18px;padding:10px 12px;font:inherit;color:inherit;cursor:pointer}
.gamecard:active{transform:scale(.98)}
.gamecard.soon{opacity:.55;cursor:default}
.gi{width:46px;flex-shrink:0}.gi img{width:100%;display:block;border-radius:6px}
.gt{display:flex;flex-direction:column;gap:2px}.gt b{font-size:18px;color:#9A5F37}.gt span{font-size:13px;color:#6b4a5c}
.back{border:0;background:none;color:#613F29;font:inherit;font-size:14px;padding:4px 0 8px;cursor:pointer}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:15px;margin-bottom:6px;gap:8px}
.bar b{color:#9A5F37;font-size:20px}
.goal{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;background:#fff;border:2px solid #E8D3C5;border-radius:14px;padding:6px 10px;margin-bottom:6px;font-size:15px}
.goal .gk{display:flex;align-items:center;gap:4px}
.goal img{width:26px;border-radius:3px}
.goal .done{color:#3B6D11;font-weight:800}
.board{position:relative;display:grid;gap:4px;background:#fff;border:2px solid #E8D3C5;border-radius:14px;padding:6px;touch-action:none}
.cell{aspect-ratio:96/124;position:relative;border-radius:7px;background:#F8F0EB}
.cell img{filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
.cell img{width:100%;height:100%;display:block;border-radius:7px;pointer-events:none}
.cell.sel{outline:3px solid #9A5F37;outline-offset:-2px;transform:scale(1.05);z-index:2}
.cell.boom img{animation:boom .28s forwards}
@keyframes boom{to{transform:scale(1.35);opacity:0}}
.cell.drop img{animation:drop .22s ease-out}
@keyframes drop{from{transform:translateY(-40%);opacity:.3}}
.cell.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cell.sp-h::after,.cell.sp-v::after{content:"";position:absolute;background:radial-gradient(circle at 50% 50%,#E24B4A 0 3.2px,transparent 3.8px),#fff;border:1.5px solid #7a7a7a;border-radius:999px;box-shadow:0 0 0 1.5px #fff,0 0 8px #F2C230;pointer-events:none;animation:glow 1s infinite alternate}
.cell.sp-h::after{left:6%;right:6%;bottom:3%;height:11px}
.cell.sp-v::after{top:30%;bottom:3%;right:2%;width:11px}
.cell.sp-logo{box-shadow:0 0 0 3px #F2C230,0 0 10px #CA7B47;animation:glow 1s infinite alternate}
@keyframes glow{to{filter:brightness(1.15)}}
.say{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:38px;font-weight:800;color:#9A5F37;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;pointer-events:none;animation:say .8s forwards;z-index:4}
@keyframes say{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.1);opacity:1}80%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(252,248,245,.96);border-radius:14px;z-index:5;text-align:center;padding:10px}
.over .big{font-size:34px;font-weight:800;color:#9A5F37}
.over .stars{font-size:34px;color:#F2C230;letter-spacing:4px}
.btn{border:0;border-radius:999px;padding:12px 26px;font:inherit;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,#9A5F37,#CA7B47);box-shadow:0 4px 0 #72482B;cursor:pointer;margin-top:10px}
.btn2{border:2px solid #9A5F37;background:#fff;color:#9A5F37;border-radius:999px;padding:8px 20px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;margin-top:8px}
.msg{text-align:center;font-size:14px;color:#613F29;min-height:22px;margin:6px 0}
.rule{font-size:12.5px;color:#6b4a5c;line-height:1.75;background:#fff;border:2px solid #E8D3C5;border-radius:14px;padding:8px 12px;margin-top:10px}
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stg{border:2px solid #E8D3C5;background:#fff;border-radius:14px;padding:10px 4px;font:inherit;color:#29221E;cursor:pointer;text-align:center}
.stg b{display:block;font-size:22px;color:#9A5F37}
.stg .st{color:#F2C230;font-size:14px;letter-spacing:1px}
.stg.lock{opacity:.45;cursor:default}
.hand{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;background:#fff;border:2px solid #E8D3C5;border-radius:14px;padding:6px;margin-bottom:6px;min-height:52px}
.hand img{width:calc((100% - 13*2px)/14);max-width:30px;border-radius:3px}

.note{font-size:12px;color:#613F29}
/* うさぎポン：ドラ・カエル・演出 */
.cell.dora{box-shadow:0 0 0 2px #F2C230,0 0 12px #F2C230;animation:glow .8s infinite alternate}
.dtag{position:absolute;top:2px;right:2px;background:#F2C230;color:#4D311F;font-size:10px;font-weight:800;border-radius:4px;padding:0 3px;pointer-events:none}
.frog{position:absolute;right:-3px;bottom:-5px;font-size:clamp(14px,4.6vw,19px);filter:drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff);pointer-events:none;animation:hop 1.2s infinite}
.cell.hasfrog{outline:3px solid #5BB8E8;outline-offset:-3px}
.frog.big{font-size:clamp(18px,6vw,24px)}
.frog.big::after{content:"×2";position:absolute;right:-12px;top:-2px;font-size:10px;font-weight:800;color:#3B6D11;background:#fff;border-radius:4px;padding:0 2px}
@keyframes hop{0%,80%,100%{transform:translateY(0)}90%{transform:translateY(-4px)}}
.floaty{position:absolute;transform:translateX(-50%);font-weight:800;color:#3B6D11;font-size:15px;text-shadow:0 1px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff;pointer-events:none;z-index:6;animation:floaty .9s forwards;white-space:nowrap}
.floaty.big{font-size:26px;color:#C98A00}
@keyframes floaty{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-40px}}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:6;animation:spark .6s forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.conf{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:6;animation:conf 1.4s ease-in forwards}
@keyframes conf{to{transform:translateY(560px) rotate(var(--rot));opacity:.2}}
.board{overflow:hidden}
.board.quake{animation:quake .35s}
@keyframes quake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(3px,1px)}}
.rabifx{position:absolute;left:8%;right:8%;top:30%;background:linear-gradient(135deg,#FFF3B0,#F2C230);border:3px solid #fff;border-radius:20px;box-shadow:0 0 20px #F2C230;text-align:center;padding:14px;z-index:7;animation:rabifx 1.8s forwards}
.rabifx div{font-size:44px}.rabifx b{display:block;font-size:34px;color:#72482B}.rabifx span{font-size:12px;color:#4D311F}
@keyframes rabifx{0%{transform:scale(.2) rotate(-10deg);opacity:0}15%{transform:scale(1.1) rotate(3deg);opacity:1}25%{transform:scale(1) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}

/* サイコロ・あそびかたカード */
.dice{position:absolute;right:-2px;top:-2px;font-size:clamp(14px,4.6vw,18px);pointer-events:none;filter:drop-shadow(0 1px 0 #fff);animation:glow .9s infinite alternate}
.cardbox{position:fixed;inset:0;background:rgba(41,34,30,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.tcard{background:#fff;border-radius:22px;max-width:380px;width:100%;padding:16px;text-align:center;border:3px solid #E8D3C5;animation:appear2 .25s}
@keyframes appear2{from{transform:scale(.8);opacity:0}}
.tcard .tt{font-size:20px;font-weight:800;color:#9A5F37;margin-bottom:8px}
.tcard p{margin:8px 0;font-size:15px;line-height:1.6}
.tcard p.sub{font-size:13px;color:#6b4a5c}
.demo{display:flex;justify-content:center;align-items:center;gap:3px;background:#FCF8F5;border-radius:14px;padding:10px}
.demo.grid3{display:grid;grid-template-columns:repeat(3,44px);justify-content:center}
.demo .arr{font-size:22px;color:#9A5F37;margin:0 4px}
.mcell{position:relative;display:inline-block;width:44px;aspect-ratio:96/124;border-radius:6px;background:#F8F0EB}
.mcell img{width:100%;height:100%;display:block}
.mcell.hasfrog{outline:3px solid #5BB8E8;outline-offset:-3px}
.mcell.dora{box-shadow:0 0 0 2px #F2C230,0 0 10px #F2C230}
.mcell.sp-logo{box-shadow:0 0 0 3px #F2C230,0 0 8px #CA7B47}
.mcell .frog{font-size:18px}
.mstick{position:absolute;background:radial-gradient(circle at 50% 50%,#E24B4A 0 3px,transparent 3.6px),#fff;border:1.5px solid #7a7a7a;border-radius:999px;box-shadow:0 0 6px #F2C230}
.mstick.h{left:6%;right:6%;bottom:3%;height:10px}
.mstick.v{top:30%;bottom:3%;right:2%;width:10px}
.combo{display:flex;flex-direction:column;gap:6px;background:#FCF8F5;border-radius:14px;padding:8px}
.combo>div{display:grid;grid-template-columns:44px 14px 44px 1fr;align-items:center;gap:4px;text-align:left}
.combo b{color:#9A5F37;font-size:15px;grid-column:4}
.combo span:not(.mcell):not(.dice){grid-column:4;font-size:12px;color:#6b4a5c;margin-top:-6px}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.dots i{width:8px;height:8px;border-radius:50%;background:#E8D3C5}.dots i.on{background:#9A5F37}
.tbtns{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tbtns .btn{margin-top:4px}
/* ラビのおたまじゃくし */
.tad{position:absolute;right:-5px;bottom:-3px;width:66%;pointer-events:none;animation:wig 1s infinite ease-in-out;z-index:1}
.tad svg,.tadi svg{width:100%;display:block}
.tad.big{width:70%;bottom:2px}
.tadi{display:inline-block;width:30px;vertical-align:middle;margin:0 1px}
@keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateX(-2px)}}
.pond{background:#E3F4FF;border:2px solid #8FCBF0;border-radius:16px;padding:10px 12px;text-align:center;margin-bottom:10px}
.pond .pt{font-weight:800;color:#1C5D8C;margin-bottom:6px}
.pond .tads{display:grid;grid-template-columns:repeat(20,1fr);gap:1px;margin-bottom:6px}
.pond .tads .tadi{width:100%;margin:0}
.pond .empty{aspect-ratio:48/34;border:1.5px dashed #8FCBF0;border-radius:50%}
.pond .cnt{font-size:14px;color:#1C5D8C}.pond .cnt b{color:#9A5F37}
.pond .btn{margin-top:8px}
.btn.off{background:#ddd;box-shadow:0 4px 0 #bbb;color:#888}
.pnote{font-size:12px;color:#1C5D8C;margin-top:8px;line-height:1.6}
.btn2.small{font-size:12px;padding:5px 12px;margin-top:6px}
.pfrog{font-size:56px;animation:hop2 1s infinite}@keyframes hop2{50%{transform:translateY(-8px)}}
.wintad{font-size:14px;color:#1C5D8C;margin-top:6px}
.over.kaeru{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(252,248,245,.96);text-align:center;padding:20px}
/* 1ゲーム無料券 */
.tk{background:#FFF8D6;border:2px solid #F2C230;border-radius:16px;padding:10px 12px;text-align:center;margin-bottom:10px}
.tk .t{font-weight:800;color:#8A5A00;font-size:16px}
.tk .left{display:inline-block;background:#9A5F37;color:#fff;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:800;margin:6px 0}
.tk .tbar{height:14px;background:#F6E7B0;border-radius:7px;overflow:hidden;margin:6px 0 4px}.tk .tbar i{display:block;height:14px;background:#F2C230}
.tk .c{font-size:14px;color:#8A5A00}.tk .c b{color:#9A5F37}
.tk .n{font-size:12px;color:#8A5A00;margin-top:6px;line-height:1.6}
.tk .btn{margin-top:8px}
.ticket{margin:8px auto 0;max-width:300px;background:#fff;border:2px dashed #9A5F37;border-radius:12px;padding:10px;text-align:center}
.ticket b{display:block;font-size:20px;color:#9A5F37}.ticket span{display:block;font-size:12px;color:#6b4a5c}
.ticket.used{opacity:.55;border-color:#aaa}.ticket.used b{color:#888}
/* ボーナス・ためしボタン */
.bonusrow{background:#fff;border:2px solid #E8D3C5;border-radius:16px;padding:8px;margin-top:10px}
.bonusrow .bt{font-weight:800;color:#613F29;text-align:center;margin-bottom:6px}.bonusrow .bt span{display:block;font-size:11px;font-weight:400;color:#6b4a5c}
.bbtns{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.testbox{background:#F3F3F3;border:2px dashed #BBB;border-radius:14px;padding:8px 10px;margin:10px 0;font-size:13px}
.testbox .tt2{font-weight:800;color:#555;text-align:center;margin-bottom:4px}
.testbox .ti{padding:6px 0;border-top:1px dashed #ccc}.testbox .ti span{font-size:11px;color:#666}
/* 合体技の演出 */
.cell.glow{z-index:2}
.cell.glow img{animation:cglow .45s infinite alternate}
@keyframes cglow{from{filter:drop-shadow(0 0 0 #FFD000) brightness(1)}to{filter:drop-shadow(0 0 7px #FFC400) drop-shadow(0 0 3px #FF8A00) brightness(1.15);transform:scale(1.06)}}
.cell.glow::before{content:"";z-index:1;position:absolute;inset:0;border-radius:7px;background:rgba(255,214,0,.28);pointer-events:none}
.cell.gone img{opacity:0}
.ccard{position:absolute;left:6%;right:6%;top:32%;z-index:6;background:rgba(255,255,255,.95);border:3px solid #F2C230;border-radius:18px;padding:10px 8px;text-align:center;pointer-events:none;animation:cin .35s cubic-bezier(.3,1.6,.5,1)}
.ccard b{display:block;font-size:40px;font-weight:800;text-shadow:0 2px 0 #fff}
.ccard span{display:block;font-size:15px;color:#29221E;line-height:1.5}
.ccard.out{animation:cout .3s forwards}
@keyframes cin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes cout{to{transform:scale(1.3);opacity:0}}
.cell.boom::after,.cell.boom .dice,.cell.boom .dtag{animation:boom .28s forwards}
.cell.gone::after,.cell.gone .dice,.cell.gone .dtag{display:none}
.cell.pv1::before{content:"";position:absolute;inset:0;z-index:1;border-radius:7px;background:rgba(255,214,0,.22);box-shadow:inset 0 0 0 2px rgba(242,194,48,.7);pointer-events:none}
.ask{margin:8px 0 0;background:rgba(255,255,255,.96);border:3px solid #F2C230;border-radius:16px;padding:8px;text-align:center;animation:cin .3s}
.ask .aq{font-size:14px;color:#29221E;margin-bottom:4px}.ask .aq b{color:#9A5F37;font-size:17px}
.ask .btn{margin:4px 6px}.ask .btn2{margin:4px 6px}
/* 連鎖の演出 */
.say.plus1{top:18%;font-size:34px;color:#22A8E0;animation:say 1.1s forwards}
.bar span.plus{animation:plusbar .9s}
@keyframes plusbar{0%,100%{transform:scale(1)}30%{transform:scale(1.35);color:#22A8E0;text-shadow:0 0 8px #9fe0ff}}
/* おたま白 */
.ota{position:absolute;left:14%;width:72%;top:42%;pointer-events:none;animation:wig 1.2s infinite ease-in-out;filter:drop-shadow(0 1px 0 #fff)}
.ota svg{width:100%;display:block}
.mcell .ota{top:40%}
.gk.scp{margin-left:auto}.gk.scp .tadi{width:26px}
.wtads{margin:2px 0}.wtads .tadi{width:18px}

/* ★うさポン（課金版）見本 */
.wal{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#FFF6DC;border:2px solid #F2C230;border-radius:14px;padding:6px 12px;margin-bottom:8px;font-weight:800;color:#7A5A00}
.wal b{font-size:19px;color:#72482B}.wal .ws{font-size:12px;font-weight:500}
.paytbl{text-align:center;background:#fff;border:2px dashed #F2C230;border-radius:12px;padding:6px;margin:6px 0 10px;font-size:14px;color:#7A5A00}
.paytbl small{display:block;font-size:11px}
.slist{display:grid;gap:6px}
.scard{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:2px solid #E8D3C5;border-radius:14px;padding:8px 10px;font:inherit;cursor:pointer;min-height:52px}
.scard.boss{border-color:#F2C230;background:linear-gradient(90deg,#FFF6DC,#fff)}
.scard.lock{opacity:.5;cursor:default}
.scard .sn{flex:none;width:38px;height:38px;border-radius:50%;background:#9A5F37;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.scard.boss .sn{background:#C98A00;font-size:13px}
.scard .sm{flex:1;display:flex;flex-direction:column}.scard .sm b{font-size:15px}.scard .sm small{font-size:12px;color:#6b4a5c}
.scard .ss{color:#F2C230;font-size:18px;letter-spacing:1px}
.mlist{background:#fff;border:2px solid #E8D3C5;border-radius:12px;padding:6px 12px;margin:8px 0;text-align:left;font-size:15px;font-weight:800}
.mlist .mi{padding:2px 0}
.boost{display:flex;align-items:center;gap:6px;justify-content:center;font-size:14px;margin:8px 0 0}
.boost input{width:20px;height:20px;accent-color:#9A5F37}
.payres{background:#FFF6DC;border:2px solid #F2C230;border-radius:14px;padding:8px 14px;margin:8px 0;font-size:16px;text-align:center}
.payres b{font-size:22px;color:#72482B}
.stbar{position:relative;height:10px;background:#F0E8E2;border-radius:5px;margin:2px 4px 18px}
.stbar i{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,#CA7B47,#F2C230);transition:width .4s}
.stbar span{position:absolute;top:10px;transform:translateX(-50%);font-size:10px;white-space:nowrap}
.tools{display:flex;gap:6px;justify-content:center;margin:8px 0 0}
.tools button{flex:1;max-width:120px;border:2px solid #E8D3C5;background:#fff;border-radius:12px;font:inherit;font-size:20px;padding:4px 2px;cursor:pointer;min-height:48px;display:flex;flex-direction:column;align-items:center}
.tools button small{font-size:11px;color:#6b4a5c;font-weight:800}
.tools button.on{background:#9A5F37;border-color:#9A5F37}.tools button.on small{color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(41,34,30,.92);color:#fff;font-size:14px;padding:10px 16px;border-radius:14px;z-index:90;max-width:90%;text-align:center}
/* 妨害 */
.cell.ice::before{content:"";position:absolute;inset:0;z-index:1;border-radius:7px;pointer-events:none;background:linear-gradient(135deg,rgba(190,235,255,.55),rgba(140,210,245,.45));box-shadow:inset 0 0 0 2px rgba(255,255,255,.9)}
.cell.ice2::before{background:linear-gradient(135deg,rgba(150,215,250,.75),rgba(90,175,230,.65)),repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.5) 6px 7px);box-shadow:inset 0 0 0 3px #fff}
.cell.blk{background:transparent}
.cell.blk-box .bx{position:absolute;inset:0;border-radius:6px;background:repeating-linear-gradient(0deg,#C8935A 0 7px,#B07A42 7px 9px);box-shadow:inset 0 0 0 3px #8A5A2A;display:flex;align-items:center;justify-content:center;font-size:0}
.cell.blk-box .bx b{font-size:15px;color:#fff;background:#8A5A2A;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-weight:800}
.cell.blk-mud .md{position:absolute;inset:0;border-radius:8px;background:radial-gradient(circle at 30% 35%,#9B6B43 0 20%,transparent 21%),radial-gradient(circle at 70% 60%,#8A5A35 0 24%,transparent 25%),#6E4A2C;box-shadow:inset 0 0 0 2px #4A2F1A}
.chn{position:absolute;inset:0;z-index:2;border-radius:7px;pointer-events:none;border:3px dashed #555;background:repeating-linear-gradient(45deg,transparent 0 9px,rgba(80,80,80,.35) 9px 12px)}
.tmr{position:absolute;top:-4px;left:-4px;z-index:3;width:22px;height:22px;border-radius:50%;background:#333;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
.tmr.hot{background:#E2241B;animation:glow .5s infinite alternate}
.cell.crack{animation:shake .3s}
.cell.tl{outline:2px dashed #9A5F37;outline-offset:-2px}
.testbox{background:#F3F3F3;border:2px dashed #BBB;border-radius:14px;padding:8px 10px;margin-top:10px;font-size:13px;text-align:center}
.testbox .tt2{font-weight:800;color:#555;margin-bottom:4px}

/* ★1127 牌の顔ぶれ */
.krow{display:inline-flex;gap:2px;flex-wrap:wrap;justify-content:center}
.krow img{width:22px;display:block}
.kbox{background:#F4FBFA;border:2px solid #9FD8D0;border-radius:12px;padding:5px 8px;margin:6px 0;text-align:center}
.kbox .kt{font-size:12px;color:#4B6B6F;font-weight:800;margin-bottom:3px}
.kbox .ky{font-size:11.5px;color:#8A5A00;margin-top:4px;line-height:1.5}
.kinds{text-align:center;margin:2px 0 4px}
.kinds .krow img{width:18px}

/* ★1127 道具は1つだけタダ */
.tnote{text-align:center;font-size:11.5px;color:#4B6B6F;margin:-2px 0 4px}
.tools.used button{opacity:.45}

/* ★1127 今日のチャレンジ・記録・ヒント */
.daybox{background:#FFF8E1;border:2px solid #E8C64A;border-radius:12px;padding:6px 10px;margin:4px 0 8px;font-size:12.5px;color:#7A5A00;line-height:1.7}
.daybox b{color:#B05A00}
.ss em.chal{font-style:normal;margin-right:2px}
.cell.hint{animation:hintp .7s ease-in-out infinite alternate;box-shadow:0 0 0 3px #FFD84A,0 0 14px #FFD84A;z-index:2}
@keyframes hintp{from{transform:scale(1)}to{transform:scale(1.1)}}
.recbox{overflow:auto;max-height:92vh}
.sttop{background:#FFF8E1;border:2px solid #E8C64A;border-radius:12px;padding:5px 10px;font-weight:800;color:#7A5A00;font-size:13px;margin:6px 0}
.sttb{width:100%;border-collapse:collapse;background:#fff;font-size:12px;margin-bottom:8px}
.sttb th{background:#F9EFE9;color:#704B32;padding:4px 2px;font-size:11px}.sttb td{padding:4px 2px;border-top:1px solid #EFEAE7;text-align:right;white-space:nowrap}
.sttb td:first-child{text-align:left;white-space:normal}.sttb tr.top td{background:#FFF8E1;font-weight:800}.sttb tr.none td{color:#B8AAB0}
/* ★1127 牌のまわりの四角をなくす（うさぎの形だけ）・あそびかたは別ページ */
.cell{background:transparent}
.cell img{border-radius:0;filter:drop-shadow(0 1.5px 1.5px rgba(98,69,51,.22))}
.board{background:#FDF9F6}
.rulesp{position:fixed;inset:0;z-index:200;background:#FDF9F6;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rulesp .rbar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(135deg,#9A5F37,#CF895B);color:#fff;font-size:16px;z-index:1}
.rulesp .rclose{border:2px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:5px 14px;font:inherit;font-weight:800;font-size:14px;min-height:38px;cursor:pointer}
.rulesp .rin{max-width:480px;margin:0 auto;padding:10px 12px 40px}
.rulesp .rcard{background:#fff;border:2px solid #E8D3C5;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.85}
.rulesp h2{font-size:16px;color:#794E31;margin:14px 0 6px}
.btn2.rbtn{border-width:2px;font-size:14px;padding:7px 16px}
/* ★1127 大きい文字は1行に（段落ちしない） */
.ccard b,.say,.say div,.floaty.big{white-space:nowrap}
.ccard b{overflow:hidden}
.say{overflow:hidden;padding:0 6px}
.bar span{white-space:nowrap}
.bar{font-size:14px}
/* ★1128 ランキング */
.rtabs{display:flex;gap:6px;margin:10px 0 8px}.rtabs button{flex:1;border:2px solid #CA7B47;background:#fff;color:#613F29;border-radius:999px;font:inherit;font-weight:800;font-size:13px;min-height:38px;cursor:pointer}.rtabs button.on{background:#9A5F37;border-color:#9A5F37;color:#fff}
.rme{background:#FFF8E1;border:2px solid #E8C64A;border-radius:12px;padding:8px 10px;font-size:14px;color:#7A5A00;text-align:center;margin-bottom:8px}.rme b{font-size:22px;color:#B05A00}
.rtb{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:14px}
.rtb td{padding:8px 6px;border-top:1px solid #F0E4DA}.rtb td.rk{width:44px;text-align:center;font-size:18px;font-weight:800;color:#613F29}.rtb td.v{text-align:right;font-weight:800;color:#9A5F37;white-space:nowrap}.rtb td.v small{font-weight:500;margin-left:2px;color:#6B5040}
.rtb tr.top1 td{background:#FFF6D5}.rtb tr.top2 td{background:#F3F4F6}.rtb tr.top3 td{background:#FBEFE6}.rtb tr.me td{background:#FCE9DC;font-weight:800}.rtb td.nm small{color:#B05A00}

.gate{text-align:center;padding:26px 16px;font-size:14px;line-height:1.8;background:#fff;border:2px solid #E8D2C4;border-radius:16px;margin:10px 0}
.busymark{display:none;position:fixed;top:10px;right:10px;background:rgba(154,95,55,.9);color:#fff;font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;z-index:300}
body.busy .busymark{display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(40,29,23,.92);color:#fff;font-size:14px;padding:10px 16px;border-radius:14px;z-index:400;max-width:90%;text-align:center}
</style>

<script>
function $(id){ return document.getElementById(id); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
var TILE_NAME = { m1:"一萬", m9:"九萬", z1:"東", z2:"南", z3:"西", z4:"北", z5:"白", z6:"發", z7:"中", logo:"うさぎ" };
function tname(k){ return TILE_NAME[k] || (k.charAt(1) + (k.charAt(0) === "p" ? "筒" : "索")).replace(/^(\d)/, function(d){ return "〇一二三四五六七八九".charAt(+d); }); }
function shuffle(a){ for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function say(boardId, text){
  var d = document.createElement("div"); d.className = "say"; d.textContent = text;
  $(boardId).appendChild(d); setTimeout(function(){ d.remove(); }, 820);
}
function store(key, val){
  try { if (val === undefined) return JSON.parse(localStorage.getItem(key) || "null"); localStorage.setItem(key, JSON.stringify(val)); } catch(e){ return null; }
}
// タップとスワイプ（なぞり）を見分ける
function swipeOn(el, onTap, onSwipe){
  var sx = 0, sy = 0, st = null;
  el.addEventListener("pointerdown", function(e){ sx = e.clientX; sy = e.clientY; st = e.target.closest(".cell"); });
  el.addEventListener("pointerup", function(e){
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22){ if (st && onTap) onTap(st); return; }
    var dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "R" : "L") : (dy > 0 ? "D" : "U");
    if (onSwipe) onSwipe(dir, st);
  });
}

  function fill(){

  function addKill(kill, r, c){ if (r >= 0 && c >= 0 && r < R && c < C) kill[r+","+c] = 1; }
  var movedKinds = {}, mudHit = false;
  function isFix(x){ return !!(x && (x.blk || x.chain)); }
  async function clear(kill, make, chain, shown){
    var changed = true, fired = false;
    while (changed){
      changed = false;
      Object.keys(kill).forEach(function(key){
        var p = key.split(","), x = B[+p[0]][+p[1]];
        if (x && !x.blk && (x.sp === "h" || x.sp === "v" || x.sp === "dice") && !x.fired){
          x.fired = true; changed = true; fired = true;
          if (x.sp === "dice"){ for (var di = -1; di <= 1; di++) for (var dj = -1; dj <= 1; dj++) addKill(kill, +p[0] + di, +p[1] + dj); }
          else for (var i = 0; i < (x.sp === "h" ? C : R); i++){ var k2 = x.sp === "h" ? p[0] + "," + i : i + "," + p[1]; kill[k2] = 1; }
        }
      });
    }
    if (fired){ SND.boom(); shakeBoard(); }
    var cls = {}, dora = false, n = 0, obPts = 0, hit = {}, msgs = [];
    function hitBlk(r, c){
      var key = r + "," + c, y = B[r] && B[r][c];
      if (!y || !y.blk || hit[key]) return;
      hit[key] = 1; y.hp--; obPts += y.blk === "box" ? 50 : 40;
      if (y.blk === "mud") mudHit = true;
      cls[key] = y.hp <= 0 ? "boom" : "crack";
      if (y.hp <= 0) floatAt(r, c, y.blk === "box" ? "こわれた！" : "どろ消えた！");
    }
    Object.keys(kill).forEach(function(key){
      var p = key.split(","), r = +p[0], c = +p[1], x = B[r][c];
      if (x && x.blk){ hitBlk(r, c); return; }
      if (!x) return;
      if (x.dora) dora = true;
      if (left && left[x.k] !== undefined && x.sp !== "logo" && !make[key]) left[x.k]--;
      if (x.sp !== "logo") movedKinds[x.k] = 1;
      if (x.chain){ obPts += 20; floatAt(r, c, "くさりはずれた！"); }
      if (x.tm){ obPts += 100; floatAt(r, c, "時限牌セーフ！"); }
      if (I[r][c]){ I[r][c]--; obPts += 30; if (!I[r][c]) floatAt(r, c, "パリン！"); }
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){ if (!kill[(r + d[0]) + "," + (c + d[1])]) hitBlk(r + d[0], c + d[1]); });
      cls[key] = shown ? "gone" : "boom"; n++;
    });
    var pts = n * 10 * chain * (dora ? 2 : 1) + obPts;
    score += pts;
    if (dora){ SND.dora(); floatMid("ドラ！×2 ✨"); }
    if (obPts) SND.kero();
    if (!shown) sparkle(Object.keys(kill).filter(function(k){ return !hit[k]; }));
    draw(cls); drawGoal();
    $("pMsg").textContent = "+" + pts + "点" + (chain > 1 ? "（" + chain + "連鎖）" : "");
    await sleep(shown ? 120 : 300);
    // 消えたマスを空にする（こわれていない妨害はのこす）
    Object.keys(kill).forEach(function(key){ var p = key.split(","), x = B[+p[0]][+p[1]]; if (x && x.blk && x.hp > 0) return; B[+p[0]][+p[1]] = make[key] || null; });
    Object.keys(hit).forEach(function(key){ var p = key.split(","), x = B[+p[0]][+p[1]]; if (x && x.blk && x.hp <= 0) B[+p[0]][+p[1]] = null; });
    gravity();

  // 落ちる：木箱・どろ・くさりの牌は動かない。そこで区切って、区切りの中で下へつめて、上から新しい牌
  function gravity(){
    var dropped = {};
    for (var c = 0; c < C; c++){
      var r = R - 1;
      while (r >= 0){
        if (isFix(B[r][c])){ r--; continue; }
        var end = r, s = r;
        while (s - 1 >= 0 && !isFix(B[s - 1][c])) s--;
        var col = []; for (var rr = end; rr >= s; rr--) if (B[rr][c]) col.push(B[rr][c]);
        for (var r2 = end, i = 0; r2 >= s; r2--, i++){
          var was = B[r2][c];
          B[r2][c] = i < col.length ? col[i] : helpCell(r2, c);
          if (was !== B[r2][c]) dropped[r2 + "," + c] = "drop";
        }
        r = s - 1;
      }
    }
    draw(dropped);
  }

  /* ---------- 1手のあと ---------- */
  function finish(noMove){
    // 🀄 役（1手で消した牌の種類）
    var ks = Object.keys(movedKinds);
    if (ks.length){
      var all = S.kinds.every(function(k){ return movedKinds[k]; });
      if (all){ var kp = kokushi(); score += kp; bigYaku("国士無双！", "ぜんぶの種類（" + S.kinds.length + "種）を1手で消した ＋" + kp + "点"); }
      else {
        var hit = yakuOf(S.kinds).filter(function(y){ return y.need.every(function(k){ return movedKinds[k]; }); });
        if (hit.length){ var pt = 0; hit.forEach(function(y){ pt += y.pts; }); score += pt;
          bigYaku(hit.map(function(y){ return y.name; }).join("＋") + "！", hit.map(function(y){ return y.sub; }).join("・") + " ＋" + pt + "点"); }
      }
    }
    movedKinds = {};
    if (!noMove){
      // 💣 時限牌のカウントダウン
      B.forEach(function(row){ row.forEach(function(x){ if (x && x.tm) x.tm--; }); });
      // 🟫 どろ：この手でどろを消さなかったら、1つ広がる
      if (!mudHit && countLeft("mud")){
        var cand = [];
        for (var r = 0; r < R; r++) for (var c = 0; c < C; c++){ var x = B[r][c]; if (x && x.blk === "mud") [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){ var y = B[r + d[0]] && B[r + d[0]][c + d[1]]; if (y && !y.blk && !y.chain && !y.tm && !y.sp) cand.push([r + d[0], c + d[1]]); }); }
        if (cand.length){ var q = cand[Math.floor(Math.random() * cand.length)]; B[q[0]][q[1]] = { blk: "mud", hp: 1 }; $("pMsg").textContent = "🟫 どろが広がった！"; }
      }
      mudHit = false;
    }
    draw();
    var done = drawGoal();
    if (done){ win(); busy = false; return; }
    var boom = false; B.forEach(function(row){ row.forEach(function(x){ if (x && x.tm !== undefined && x.tm <= 0) boom = true; }); });
    if (boom){ lose("timer"); busy = false; return; }
    if (moves <= 0){ lose("moves"); busy = false; return; }
    if (!hasMove()){ $("pMsg").textContent = "動かせる所がないから、牌をまぜたよ🔀"; reshuffle(); draw(); }
    busy = false;
  }
  function yakuOf(ks){ return YAKU.filter(function(y){ return y.need.every(function(k){ return ks.indexOf(k) >= 0; }); }); }
  function kokushi(){ return 1000 + (S.kinds.length - 6) * 250; }   // 種類が多いほど大きい
  function kindRow(ks){ return '<span class="krow">' + ks.map(function(k){ return img(k); }).join("") + '</span>'; }
  function bigYaku(name, sub){
    var b = $("pBoard"); if (!b) return;
    var d = document.createElement("div"); d.className = "ccard";
    d.innerHTML = '<b style="color:#C98A00">🀄 ' + name + '</b><span>' + sub + '</span>';
    b.appendChild(d); fitBig(d.querySelector("b")); SND.rabi(); confetti(30);
    setTimeout(function(){ d.classList.add("out"); setTimeout(function(){ d.remove(); }, 300); }, 1300);
  }
  function reshuffle(){
    var pos = [], all = [];
    for (var r = 0; r < R; r++) for (var c = 0; c < C; c++){ var x = B[r][c]; if (x && !isFix(x)){ pos.push([r, c]); all.push(x); } }
    for (var t = 0; t < 60; t++){
      shuffle(all); pos.forEach(function(p, i){ B[p[0]][p[1]] = all[i]; });
      if (!runs().length && hasMove()) return;
    }
  }

  /* ---------- 道具 ---------- */
  function toolNote(){ var n = $("pTnote"); if (n) n.textContent = toolN < FREE_TOOL ? "道具は1つ目はタダ（2つ目から" + TOOL_PRICE + "ラビ）" : "道具は1つ" + TOOL_PRICE + "ラビ（いま " + W0().rabi + "ラビ）"; }
  // 道具を使うとき：1つ目はタダ・2つ目から5ラビ。払えなかったら false
  function buy(kind, what){
    var free = kind === "cont" ? contN < FREE_CONT : toolN < FREE_TOOL, price = kind === "cont" ? CONT_PRICE : TOOL_PRICE;
    if (!LIVE) return Promise.resolve(free || pay(price, what));
    if (!free && W0().rabi < price){ toastU("がま口のラビが足りないよ🐸（" + price + "ラビ）"); return Promise.resolve(false); }
    // ★1128 待たずにすぐ使える：手もとの数をさきに減らして、係へのお知らせはうしろで送る
    var v = LV(); if (!free){ v.gama = (v.gama || 0) - price; paidThis += price; } showWallet();
    var myRound = UponLive.startP;
    UponLive.buy(kind).then(function(){ showWallet(); }, function(e){
      toastU(e.message);
      if (!free){ v.gama += price; paidThis -= price; showWallet(); }
      if (kind === "cont" && !ended && UponLive.startP === myRound){ moves = 0; drawGoal(); lose("moves"); }   // 係が「だめ」と言ったときだけ、この回はおしまい
    });
    return Promise.resolve(true);
  }
  // 道具を使うとき：1つ目はタダ・2つ目から5ラビ。払えなかったら false
  async function toolUsed(what){ var wasBusy = busy; busy = true; var ok = await buy("tool", what); busy = wasBusy; if (!ok) return false; toolN++; toolNote(); return true; }
  function useTool(name){
    poke();
    if (busy || ended) return;
    if (toolN >= FREE_TOOL && tool !== name && W0().rabi < TOOL_PRICE){ toastU("ラビが足りないよ🐸（道具は" + TOOL_PRICE + "ラビ）"); return; }
    if (tool === name){ tool = null; sel = null; draw(); $("pMsg").textContent = "道具をやめたよ"; markTools(); return; }
    if (name === "shuf"){
      toolUsed("🔀シャッフル").then(function(ok){ if (!ok) return; reshuffle(); draw(); $("pMsg").textContent = "🔀 シャッフルしたよ（手数はへらないよ）"; tone(880, .1, "triangle", .12); });
      return;
    }
    tool = name; sel = null; draw(); markTools();
    $("pMsg").textContent = name === "ham" ? "🔨 こわしたいマスをタップしてね（木箱もどろも1回でこわせるよ）" : "✋ 入れかえたい2つのマスを、じゅんばんにタップしてね（そろわなくてもOK）";
  }
  function markTools(){ ["ham", "swap"].forEach(function(n){ var b = $("tl-" + n); if (b) b.classList.toggle("on", tool === n); }); }
  async function toolTap(el){
    var r = +el.dataset.r, c = +el.dataset.c, x = B[r][c];
    if (tool === "ham"){
      if (!x) return;
      if (!(await toolUsed("🔨トンカチ"))){ tool = null; markTools(); draw(); return; }
      busy = true; tool = null; markTools();
      if (x.blk) x.hp = 1;
      var k = {}; k[r + "," + c] = 1;
      SND.boom(); shakeBoard();
      await clear(k, {}, 1, false); await cascade(1); finish(true); return;
    }
    if (tool === "swap"){
      if (!x || isFix(x)){ $("pMsg").textContent = "そのマスは動かせないよ"; return; }
      if (!sel){ sel = [r, c]; draw(); return; }
      var dr = Math.abs(sel[0] - r), dc = Math.abs(sel[1] - c);
      if (dr + dc !== 1){ sel = [r, c]; draw(); return; }
      if (!(await toolUsed("✋いれかえ"))){ tool = null; sel = null; markTools(); draw(); return; }
      busy = true; var a = sel; sel = null; tool = null; markTools();
      swap(a, [r, c]); draw(); await sleep(150);
      if (runs().length) await cascade(0);
      finish(true); return;
    }
  }

  /* ---------- おわり ---------- */
  function winBox(st, sc, bonus, back, rep0, chal, had, repLeft, mult, waiting){
    return '<div style="font-size:15px;color:#11697C">' + S.def.name + '</div><div class="big">クリア！🎉</div>' +
      '<div class="stars">' + "★★★".slice(0, st) + '<span style="color:#e0d6b4">' + "★★★".slice(0, 3 - st) + '</span></div>' +
      '<div style="font-size:15px">点 <b style="color:#1A8BA3;font-size:20px">' + sc.toLocaleString() + '</b>（のこり' + moves + '手 +' + bonus + '）</div>' +
      (waiting ? '<div class="payres" style="background:#F4F4F4;color:#4B6B6F">🐰 ごほうびを数えているよ…</div>' :
      (back ? '<div class="payres">🎁 はじめての⭐' + st + '！ <b>' + back + 'ラビ</b> もらったよ！</div>' : '') +
      (!back && had ? '<div class="payres">' + (rep0 ? '🔁 クリアごほうび <b>＋' + rep0 + 'ラビ</b>' : '🔁 今日のクリアごほうびは、もう ' + REPEAT_CAP + 'ラビもらったよ') + '<br><small>' + (had < 3 ? 'ベストは ' + "★★★".slice(0, had) + '。⭐' + (had + 1) + 'を取ると ＋' + STAR_REWARD[had + 1] * mult + 'ラビ！' : '今日 あと ' + repLeft + 'ラビ') + '</small></div>' : '') +
      (chal ? '<div class="payres" style="background:#FFF1D6">🎯 今日のチャレンジ クリア！ <b>＋' + chal + 'ラビ</b></div>' : '')) +
      (stage + 1 < STAGES.length ? '<button class="btn" onclick="Pon.pre(' + (stage + 1) + ')">つぎのステージへ</button>' : '') +
      '<button class="btn2" onclick="Pon.pre(' + stage + ')">もう一回</button> <button class="btn2" onclick="Pon.start()">ステージえらび</button>';
  }
  function win(){
    if (ended) return; ended = true;
    var bonus = moves * 50; score += bonus;
    var st = starOf(score), mult = S.def.boss ? 2 : 1;
    if (LIVE){
      SND.win(); confetti(60);
      var d0 = document.createElement("div"); d0.className = "over"; d0.innerHTML = winBox(st, score, bonus, 0, 0, 0, 0, 0, mult, true); $("pBoard").appendChild(d0);
      var sc0 = score;
      UponLive.end(true, sc0).then(function(j){ var r = (j && j.did) || {}; showWallet();
        d0.innerHTML = winBox(r.st || st, sc0, bonus, r.first || 0, r.rep || 0, r.chal || 0, r.had || 0, r.repLeft || 0, mult, false);
        if (r.first || r.rep || r.chal) SND.rabi(); },
        function(e){ d0.innerHTML = winBox(st, sc0, bonus, 0, 0, 0, 0, 0, mult, false) + '<div style="color:#B00;font-size:13px">' + e.message + '</div>'; });
      return;
    }
    var w = W0(), had = w.stars[stage] || 0, back = st > had ? (rewardUpTo(st) - rewardUpTo(had)) * mult : 0;
    var dy = today(), rep0 = 0, chal = 0;
    if (!back && had){ rep0 = Math.min(st * mult, Math.max(0, REPEAT_CAP - dy.rep)); dy.rep += rep0; }   // 2回目からのクリア
    if (stage === chalStage() && !dy.chal){ chal = CHAL_REWARD; dy.chal = 1; }
    w.day = dy;
    var rc = (w.rec = w.rec || {})[stage] || (w.rec[stage] = { n: 0, s: [0, 0, 0, 0], best: 0 }); rc.n++; rc.s[st]++; if (score > rc.best) rc.best = score;
    if (had < st) w.stars[stage] = st;
    if ((w.best[stage] || 0) < score) w.best[stage] = score;
    w.plays++; wSave(w);
    if (back) earn(back, "はじめての⭐" + st + " " + S.def.name);
    if (rep0) earn(rep0, "クリア⭐" + st + " " + S.def.name);
    if (chal) earn(chal, "今日のチャレンジ " + S.def.name);
    SND.win(); confetti(60);
    var d = document.createElement("div"); d.className = "over";
    d.innerHTML = '<div style="font-size:15px;color:#11697C">' + S.def.name + '</div><div class="big">クリア！🎉</div>' +
      '<div class="stars">' + "★★★".slice(0, st) + '<span style="color:#e0d6b4">' + "★★★".slice(0, 3 - st) + '</span></div>' +
      '<div style="font-size:15px">点 <b style="color:#1A8BA3;font-size:20px">' + score.toLocaleString() + '</b>（のこり' + moves + '手 +' + bonus + '）</div>' +
      (back ? '<div class="payres">🎁 はじめての⭐' + st + '！ <b>' + back + 'ラビ</b> もらったよ！</div>' : '') +
      (!back && had ? '<div class="payres">' + (rep0 ? '🔁 クリアごほうび <b>＋' + rep0 + 'ラビ</b>' : '🔁 今日のクリアごほうびは、もう ' + REPEAT_CAP + 'ラビもらったよ') + '<br><small>' + (had < 3 ? 'ベストは ' + "★★★".slice(0, had) + '。⭐' + (had + 1) + 'を取ると ＋' + STAR_REWARD[had + 1] * mult + 'ラビ！' : '今日 あと ' + Math.max(0, REPEAT_CAP - dy.rep) + 'ラビ') + '</small></div>' : '') +
      (chal ? '<div class="payres" style="background:#FFF1D6">🎯 今日のチャレンジ クリア！ <b>＋' + chal + 'ラビ</b></div>' : '') +
      (stage + 1 < STAGES.length ? '<button class="btn" onclick="Pon.pre(' + (stage + 1) + ')">つぎのステージへ</button>' : '') +
      '<button class="btn2" onclick="Pon.pre(' + stage + ')">もう一回</button> <button class="btn2" onclick="Pon.start()">ステージえらび</button>';
    $("pBoard").appendChild(d);
  }
  function lose(why){
    if (ended) return; ended = true;
    var freeCont = contN < FREE_CONT;
    var rest = S.miss.map(function(m){ return m.t === "collect" ? img(m.k).replace("<img", '<img style="width:18px;vertical-align:middle"') + ' あと' + Math.max(0, left[m.k]) : OB_ICON[m.t] + ' あと' + countLeft(m.t); }).filter(function(t){ return !/あと0$/.test(t); }).join("　");
    var d = document.createElement("div"); d.className = "over"; d.id = "pLose";
    d.innerHTML = '<div class="big" style="font-size:28px">' + (why === "timer" ? '💣 ドカン！' : 'おしい…🐸') + '</div>' +
      '<div style="font-size:14px;margin-top:2px">' + (why === "timer" ? '時限牌が0になっちゃった' : '手数がなくなっちゃった') + '</div>' +
      '<div style="font-size:18px;font-weight:800;color:#B05A00;margin:6px 0">' + rest + '</div>' +
      '<button class="btn" onclick="Pon.cont()">' + (why === "timer" ? '💣 時限牌を＋5して つづける' : '＋5手で つづける') + '<br><small>' + (freeCont ? '1回目はタダ🎁' : CONT_PRICE + 'ラビ（いま ' + W0().rabi + 'ラビ）') + '</small></button>' +
      (paidThis ? '<div style="font-size:12px;color:#B05A00;margin-top:4px">この回で使ったラビ：' + paidThis + '</div>' : '') +
      '<button class="btn2" onclick="Pon.giveup(1)">もう一回</button> <button class="btn2" onclick="Pon.giveup(0)">ステージえらび</button>';
    d.dataset.why = why;
    $("pBoard").appendChild(d);
  }
  async function cont(){
    var box = $("pLose"); if (!box || box.dataset.wait) return;
    var why = box.dataset.why;
    box.dataset.wait = 1; var ok = await buy("cont", "コンティニュー（＋5手）"); delete box.dataset.wait;
    if (!ok) return;
    contN++; box.remove();
    if (why === "timer"){ B.forEach(function(row){ row.forEach(function(x){ if (x && x.tm !== undefined) x.tm += 5; }); }); if (moves <= 0) moves = 5; }
    else moves += 5;
    ended = false; busy = false; draw(); drawGoal();
    $("pMsg").textContent = why === "timer" ? "💣 時限牌が＋5！ がんばって🐸" : "手数＋5！ がんばって🐸";
    tone(1319, .15, "triangle", .15);
  }
  function help(){}
  function giveup(again){ var s0 = stage; if (LIVE) UponLive.end(false, score).catch(function(){}); if (again) pre(s0); else start(); }
  function toggleMute(){ mute = !mute; store("usagi-mute", mute); start(); }

  return { start: start, play: play, pre: pre, go: go, quit: quit, mute: toggleMute, muteIn: muteIn, tool: useTool, cont: cont, tg: tg, rec: rec, giveup: giveup, rules: rules, rank: rank, rankTab: function(n){ rankTab = n; drawRank(); }, help: help, confirmToggle: confirmToggle,
    _dbg: function(){ return { B: B, I: I, runs: runs, trySwap: trySwap, left: left, S: S, score: function(){ return score; }, moves: function(){ return moves; }, setMoves: function(m){ moves = m; }, ended: function(){ return ended; }, comboInfo: comboInfo, simKill: simKill, countLeft: countLeft, fixedAt: fixedAt, drawGoal: drawGoal, starOf: starOf, STAGES: STAGES }; } };
})();

boot();

</script>
